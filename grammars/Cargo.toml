# Independent workspace: never link these dependencies into hips.
[workspace]
resolver = "2"
members = ["python", "javascript", "typescript", "tsx", "java", "c", "cpp", "csharp", "go", "rust", "php", "ruby", "swift", "kotlin", "scala", "dart", "lua", "perl", "r", "objc", "matlab", "bash", "powershell", "sql", "haskell", "elixir", "erlang", "ocaml", "julia", "zig", "groovy", "fortran", "pascal", "ada", "solidity", "hcl", "nix", "elm", "cmake", "asm", "markdown"]

[workspace.dependencies]
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-php = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-scala = "0.26"
tree-sitter-dart = "0.2"
tree-sitter-lua = "0.5"
tree-sitter-perl = "1.1"
tree-sitter-r = "1.3"
tree-sitter-objc = "3.0"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-haskell = "0.23"
tree-sitter-elixir = "0.3"
tree-sitter-erlang = "0.20"
tree-sitter-ocaml = "0.25"
tree-sitter-julia = "0.23"
tree-sitter-zig = "1.1"
tree-sitter-groovy = "0.1"
tree-sitter-matlab = "1.3"
tree-sitter-fortran = "0.6"
tree-sitter-pascal = "0.10"
tree-sitter-ada = "0.1"
tree-sitter-solidity = "1.2"
tree-sitter-hcl = "1.1"
tree-sitter-nix = "0.3"
tree-sitter-elm = "5.9"
tree-sitter-cmake = "0.7"
tree-sitter-asm = "0.24"
tree-sitter-md = "0.5"

[profile.release]
strip = true

