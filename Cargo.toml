[package]
name = "high-performance-search-engine"
version = "0.1.0"
edition = "2021"
description = "hips: a small search engine for coding agents — hybrid BM25 + CodeRankEmbed code search over repositories, with exact Block-Max WAND underneath"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jasonthird/high-performance-search-engine"
keywords = ["search-engine", "code-search", "bm25", "mcp", "agents"]
categories = ["text-processing", "algorithms", "database-implementations"]

[[bin]]
# Short, typeable name: this binary is meant to be invoked by hand and by an
# MCP client, not only through `cargo run`.
name = "hips"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
bincode = "1"
bytemuck = "1.25.0"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError"], optional = true }
objc2-metal = { version = "0.3.2", optional = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = "0.17.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
# Optional: CodeRankEmbed inference (see `semantic` feature).
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.21", optional = true }
hf-hub = { version = "0.4", optional = true }
# Watcher daemon: setsid on spawn, kill(pid, 0) liveness probes, signals.
libc = "0.2"

# Tree-sitter grammars for declaration-aware chunking (feature `treesitter`,
# on by default). Every grammar depends on the ABI-stable `tree-sitter-language`
# crate, so one core version serves all of them.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }
tree-sitter-dart = { version = "0.2", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-perl = { version = "1.1", optional = true }
tree-sitter-r = { version = "1.3", optional = true }
tree-sitter-objc = { version = "3.0", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-powershell = { version = "0.26", optional = true }
tree-sitter-sequel = { version = "0.3", optional = true }
tree-sitter-haskell = { version = "0.23", optional = true }
tree-sitter-elixir = { version = "0.3", optional = true }
tree-sitter-erlang = { version = "0.20", optional = true }
tree-sitter-ocaml = { version = "0.25", optional = true }
tree-sitter-julia = { version = "0.23", optional = true }
tree-sitter-zig = { version = "1.1", optional = true }
tree-sitter-groovy = { version = "0.1", optional = true }
tree-sitter-matlab = { version = "1.3", optional = true }
tree-sitter-fortran = { version = "0.6", optional = true }
tree-sitter-pascal = { version = "0.10", optional = true }
tree-sitter-ada = { version = "0.1", optional = true }
tree-sitter-solidity = { version = "1.2", optional = true }
tree-sitter-hcl = { version = "1.1", optional = true }
tree-sitter-nix = { version = "0.3", optional = true }
tree-sitter-elm = { version = "5.9", optional = true }
tree-sitter-cmake = { version = "0.7", optional = true }
tree-sitter-asm = { version = "0.24", optional = true }
tree-sitter-md = { version = "0.5", optional = true }

notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
pdf-extract = "0.12.0"

# Metal for batched document encoding; Accelerate for batch-1 query
# encoding (Candle Metal is kernel-launch bound on short BERT sequences).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-ml = { version = "0.3.2", optional = true, default-features = false, features = ["std", "MLModel", "MLModelConfiguration", "MLMultiArray", "MLFeatureValue", "MLFeatureProvider", "MLDictionaryFeatureProvider", "MLFeatureDescription", "MLModelDescription", "block2"] }
candle-core = { version = "0.11", optional = true, features = ["metal", "accelerate"] }
candle-nn = { version = "0.11", optional = true, features = ["metal", "accelerate"] }
candle-transformers = { version = "0.11", optional = true, features = ["metal"] }

[features]
default = ["treesitter"]
# Declaration-aware chunking through tree-sitter for ~40 languages; without it
# the keyword heuristic in `repo.rs` is used for every file.
treesitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-go",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-php",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-swift",
    "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-scala",
    "dep:tree-sitter-dart",
    "dep:tree-sitter-lua",
    "dep:tree-sitter-perl",
    "dep:tree-sitter-r",
    "dep:tree-sitter-objc",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-powershell",
    "dep:tree-sitter-sequel",
    "dep:tree-sitter-haskell",
    "dep:tree-sitter-elixir",
    "dep:tree-sitter-erlang",
    "dep:tree-sitter-ocaml",
    "dep:tree-sitter-julia",
    "dep:tree-sitter-zig",
    "dep:tree-sitter-groovy",
    "dep:tree-sitter-matlab",
    "dep:tree-sitter-fortran",
    "dep:tree-sitter-pascal",
    "dep:tree-sitter-ada",
    "dep:tree-sitter-solidity",
    "dep:tree-sitter-hcl",
    "dep:tree-sitter-nix",
    "dep:tree-sitter-elm",
    "dep:tree-sitter-cmake",
    "dep:tree-sitter-asm",
    "dep:tree-sitter-md",
]
# GPU-accelerated BP document reordering: zero-copy Metal via objc2
# (macOS only). Off by default.
gpu = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
# Hybrid code search: CodeRankEmbed + IVF/PQ over the same doc_ids as BM25.
# Off by default so the lexical engine stays dependency-light.
semantic = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-core-ml",
]

# Candle fork with fused Metal SDPA in NomicBert attention: 1.7x faster
# document encoding at seq 512 (huggingface/candle#3918). Drop this block
# once the PR is released on crates.io.
[patch.crates-io]
candle-core = { git = "https://github.com/jasonthird/candle", branch = "nomic-bert-fused-sdpa" }
candle-nn = { git = "https://github.com/jasonthird/candle", branch = "nomic-bert-fused-sdpa" }
candle-transformers = { git = "https://github.com/jasonthird/candle", branch = "nomic-bert-fused-sdpa" }
